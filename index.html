<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <title>AYB</title>
</head>

<body>
    <!--Navbar-->
    <header>
        <nav>
            <div class="nombre-nav">
                <img src="/static/img/ayb_wordmark.png" alt="logo">
            </div>
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="caracterizticas-nav" id="navLinks">
                <div class="links-car">
                    <a href="#" class="linksNav">Servicios</a>
                </div>
                <div class="links-car">
                    <a href="#" class="linksNav">Procesos</a>
                </div>
                <div class="links-car">
                    <a href="#" class="linksNav">Nosotros</a>
                </div>
            </div>
            <div class="contactanos-car">
                <button>Contactanos</button>
            </div>

        </nav>
    </header>

    <!--Parte del servicios-->

    <section class="servicios">
        <div class="container">
            <div class="servicios-text">
                <h1 id="service-h1">Servicios de auditorias</h1>
                <p id="service-p1">Transparencia financiera para eventos y empresas.</p>
                <p id="service-p2">Cortes de caja, conciliaciones y auditoría de eventos con procesos verificables y
                    reportes a tiempo.
                </p>
                <button id="service-button">Ver Servicios</button>
            </div>
            <div class="servicios-cubes">
                <div class="cube">
                    <p>Cortes de caja</p>
                </div>
                <div class="cube">
                    <p>Auditoria de eventos</p>
                </div>
                <div class="cube">
                    <p>Reporte claros</p>
                </div>
                <div class="cube">
                    <p>Cumplimiento</p>
                </div>
            </div>
        </div>
    </section>


    <script src="/static/js/index.js"></script>
</body>

</html>
